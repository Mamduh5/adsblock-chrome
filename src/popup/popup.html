<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Shield</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <div>
        <h1>Site Shield</h1>
        <p id="siteStatus">Checking current tab...</p>
      </div>
      <label class="switch" title="Enable Site Shield globally">
        <input id="globalEnabledToggle" type="checkbox">
        <span></span>
      </label>
    </header>

    <section class="profile-panel" aria-label="Matched profile">
      <div>
        <span>Matched profile</span>
        <strong id="profileName">None</strong>
      </div>
      <div>
        <span>Profile id</span>
        <code id="profileId">out-of-scope</code>
      </div>
      <label>
        Profile management
        <select id="profileSelect" disabled></select>
      </label>
      <label class="check-row">
        <input id="profileEnabledToggle" type="checkbox">
        <span>Enable matched profile</span>
      </label>
    </section>

    <section class="profile-list" aria-label="Known profiles">
      <div class="section-title">Known profiles</div>
      <div id="knownProfiles"></div>
    </section>

    <section class="stats" aria-label="Session counters">
      <div>
        <strong id="blockedRequests">0</strong>
        <span>Requests</span>
      </div>
      <div>
        <strong id="removedOverlays">0</strong>
        <span>Overlays</span>
      </div>
      <div>
        <strong id="blockedRedirects">0</strong>
        <span>Redirects</span>
      </div>
      <div>
        <strong id="deletedStorageItems">0</strong>
        <span>Storage</span>
      </div>
    </section>

    <label class="check-row">
      <input id="debugToggle" type="checkbox">
      <span>Debug logging and recent events</span>
    </label>
    <label class="check-row">
      <input id="inspectionToggle" type="checkbox">
      <span>Inspection mode: log observe-only matches</span>
    </label>

    <label>
      Profile custom blocked hosts
      <textarea id="customHosts" spellcheck="false" placeholder="bad-ad-host.example"></textarea>
    </label>

    <label>
      Profile custom CSS selectors
      <textarea id="customSelectors" spellcheck="false" placeholder=".annoying-overlay"></textarea>
    </label>

    <section class="events" aria-label="Recent debug events">
      <div class="section-title">Recent events</div>
      <ol id="recentEvents"></ol>
    </section>

    <footer>
      <button id="saveButton" type="button">Save</button>
      <button id="scrubButton" type="button">Scrub cookies</button>
      <button id="resetButton" type="button">Reset counts</button>
      <button id="copyDebugButton" type="button">Copy debug</button>
    </footer>

    <p id="message" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
